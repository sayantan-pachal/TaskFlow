<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Vibrant blue to purple gradient for the main shape -->
    <linearGradient id="favGradFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.95" />
    </linearGradient>
    
    <!-- Cyan to blue gradient for the translucent background layer -->
    <linearGradient id="favGradBack" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.5" />
    </linearGradient>

    <!-- Subtle drop shadow to lift the icon off the page -->
    <filter id="fav-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    
    <!-- Blur effect for the underlying layer to create depth -->
    <filter id="fav-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Offset Back Layer (Blurred glass effect) -->
  <rect x="25" y="25" width="65" height="65" rx="22" fill="url(#favGradBack)" filter="url(#fav-blur)" />
  
  <!-- Main Front Layer (Glassmorphic box) -->
  <rect x="10" y="10" width="65" height="65" rx="22" fill="url(#favGradFront)" filter="url(#fav-shadow)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />
  
  <!-- Bold, centered checkmark for high visibility at small sizes -->
  <path d="M 28 42 L 38 52 L 58 30" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>